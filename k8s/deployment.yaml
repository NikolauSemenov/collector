apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
  namespace: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: collector
  template:
    metadata:
      labels:
        app: collector
    spec:
      containers:
        - name: collector
          image: collector:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: LOG_LEVEL
              value: "info"
            - name: BROKER_BROKERS
              value: "kafka-service.kafka.svc.cluster.local:9092"
            - name: BROKER_TOPIC_EMAIL
              value: "verify_email_events"
            - name: BROKER_CONSUMER_GROUP
              value: "email.smtp"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: BROKER_TIMEOUT
              value: "5s"
            - name: EMAIL_HOST
              value: "smtp.gmail.com"
            - name: EMAIL_PORT
              value: "465"
            - name: EMAIL_USERNAME
              value: "nikolausemenov1@gmail.com"
            - name: EMAIL_PASSWORD
              value: "vjpy mgrx pcrr xjiw"
            - name: EMAIL_SECRET_KEY
              value: "ra1dkbpJGiphNLlHlbfstkTyoNvamAcIf-vq6dOzwoY="
          ports:
            - containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
